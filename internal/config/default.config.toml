[server]
host = "127.0.0.1"
port = 8799
max_request_bytes = 1048576

[log]
level = "info"
format = "json"
include_native_payload = false

[log.stdout]
enabled = true
level = "info"
format = "console"

[log.file]
enabled = true
level = "info"
format = "json"
path = "~/.config/hitch/hitch.log"
max_size_mb = 100
max_backups = 10
max_age_days = 14
compress = true

[log.otlp]
enabled = false
endpoint = "http://127.0.0.1:4318"
protocol = "http/protobuf"

[audit]
enabled = true
backend = "sqlite"

[audit.sqlite]
path = "~/.config/hitch/events.sqlite"

[harness.codex]
enabled = true

[harness.codex.event_map]
SessionStart = "session.started"
SubagentStart = "subagent.started"
UserPromptSubmit = "turn.user_prompt"
PreToolUse = "tool.requested"
PermissionRequest = "tool.permission_requested"
PostToolUse = "tool.completed"
PreCompact = "session.compacted"
PostCompact = "session.compacted"
SubagentStop = "subagent.completed"
Stop = ["turn.completed", "turn.assistant_completed"]

[harness.hermes]
enabled = true

[harness.hermes.event_map]
pre_tool_call = "tool.requested"
pre_llm_call = ["llm.requested", "turn.user_prompt"]
on_session_start = "session.started"
on_session_end = "session.ended"
subagent_stop = "subagent.completed"
transform_tool_result = "tool.completed"
transform_terminal_output = "tool.completed"
transform_llm_output = ["llm.completed", "turn.assistant_completed"]
pre_gateway_dispatch = "turn.user_prompt"
# Full source-event catalog and opt-in mappings are documented in docs/events.md.

[harness.pi]
enabled = true

[harness.pi.event_map]
input = "turn.user_prompt"
turn_start = "turn.started"
tool_call = "tool.requested"
tool_result = "tool.completed"
turn_end = ["turn.completed", "turn.assistant_completed"]
session_start = "session.started"
session_shutdown = "session.ended"
session_before_switch = "session.resumed"
session_before_fork = "session.resumed"
session_before_compact = "session.compacted"
session_compact = "session.compacted"
user_bash = "tool.requested"
# Full source-event catalog and opt-in mappings are documented in docs/events.md.

[harness.omp]
enabled = true

[harness.omp.event_map]
input = "turn.user_prompt"
turn_start = "turn.started"
turn_end = "turn.completed"
message_end = "turn.assistant_completed"
tool_call = "tool.requested"
tool_result = "tool.completed"
session_start = "session.started"
session_before_switch = "session.resumed"
session_switch = "session.resumed"
session_before_branch = "session.resumed"
session_branch = "session.resumed"
session_before_compact = "session.compacted"
"session.compacting" = "session.compacted"
session_compact = "session.compacted"
session_before_tree = "session.resumed"
session_tree = "session.resumed"
session_shutdown = "session.ended"
auto_compaction_start = "session.compacted"
auto_compaction_end = "session.compacted"
credential_disabled = "error.reported"
user_bash = "tool.requested"
user_python = "tool.requested"
# Full source-event catalog and opt-in mappings are documented in docs/events.md.

[harness.opencode]
enabled = true

[harness.opencode.event_map]
"chat.message" = "turn.user_prompt"
"tool.execute.before" = "tool.requested"
"tool.execute.after" = "tool.completed"
"permission.ask" = "tool.permission_requested"
"session.created" = "session.started"
"session.idle" = ["turn.completed", "turn.assistant_completed"]
"session.compacted" = "session.compacted"
"experimental.session.compacting" = "session.compacted"
"session.error" = "error.reported"
# Full source-event catalog and opt-in mappings are documented in docs/events.md.

